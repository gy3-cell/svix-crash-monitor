[project]
name = "SVIX Monitor History (gy3-cell)"
description = "The daily record of Ian Martin's SVIX index and option-implied crash probabilities, rebuilt every morning from E-mini S&P 500 option settlements on CME Globex"

[dataframes.svix_monitor_history]
name = "SVIX Monitor History"
description = "One row per session: the 30-day SVIX, the VIX close, and the risk-neutral, log-utility, and power-utility probabilities of a 20% and a 10% drop in the S&P 500, computed from that session's E-mini option settlements"
path = "svix_monitor_history.csv"
date_col = "date"
docs = """One row per session, oldest first. For each session, the two
end-of-month expirations that bracket 30 days (`near_expiry`, `far_expiry`,
`days_near`, `days_far`) give `svix2_near` and `svix2_far`, Martin's (2017)
equation (12) evaluated on the Breeden-Litzenberger grid; their total variance
is interpolated linearly to 30 days as `svix2_30`, reported in VIX units as
`svix_30`. `forward_near` is the parity-implied price of the underlying future
and `rate` the one-month Treasury yield (DGS1MO, decimal). The probabilities
are read from the expiration closest to one month (`days_used`): `p_star_20`
and `p_star_10` are risk-neutral, `p_log_20` and `p_log_10` are the log
investor's (Martin 2017), and `p_power_20` is power utility with risk aversion
2 (Martin and Shi 2025). `vix` is the Cboe VIX close from FRED, when available.
The file contains no settlement prices. The deploy workflow adds one row a day
to this branch."""
